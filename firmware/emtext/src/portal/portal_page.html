<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>emtext setup</title>
<style>
  /* Design source for the pendant's captive portal. The served copy is the
     minified PAGE[] in portal.cpp -- keep the two in sync.

     Same soft-UI system as the server pages (index.html carries the notes),
     in the pendant's own material: brushed aluminium. One silver surface with
     a faint horizontal grain, elements raised or pressed by light alone, one
     anodised steel-blue accent for the single action on the page. Served from
     the ESP32 with no internet, so there is nothing external here. */
  :root{
    color-scheme:light;
    --surface:#dfe2e6; --sh-dark:#b6bac1; --sh-light:#fbfcfd;
    --ink:#1f2226; --ink-2:#5c626b; --ink-3:#8a9099;
    --accent:#2f5d8f; --accent-ink:#fff;
    --raise:7px 7px 14px var(--sh-dark),-7px -7px 14px var(--sh-light);
    --raise-sm:3px 3px 7px var(--sh-dark),-3px -3px 7px var(--sh-light);
    --press:inset 4px 4px 9px var(--sh-dark),inset -4px -4px 9px var(--sh-light);
    --press-sm:inset 2px 2px 5px var(--sh-dark),inset -2px -2px 5px var(--sh-light);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--surface);
    /* The grain: a 1px-in-3 hairline of white, then a soft sheen from the top
       left, so the whole page reads as a machined plate under a window. */
    background-image:
      radial-gradient(120% 70% at 12% -10%, rgba(255,255,255,.55), transparent 60%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px);
    color:var(--ink);
    font:16px/1.5 "Segoe UI Variable Text","Segoe UI",-apple-system,"Helvetica Neue",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:440px;margin:0 auto;padding:30px 18px 48px}
  header{text-align:center;padding:14px 0 22px}
  /* The wordmark sits on a small raised plate, like a badge set into the case. */
  .plate{
    display:inline-flex;align-items:center;gap:10px;
    padding:10px 20px;border-radius:999px;box-shadow:var(--raise);
  }
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:var(--press-sm)}
  .logo{font-weight:700;font-size:21px;letter-spacing:-.01em}
  .sub{color:var(--ink-2);font-size:13.5px;margin-top:14px}
  form{margin-top:4px}
  .card{background:var(--surface);border-radius:22px;padding:22px 20px;box-shadow:var(--raise)}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:16px 0 7px}
  label:first-of-type{margin-top:0}
  input{
    width:100%;padding:13px 14px;font-size:16px;color:var(--ink);
    background:var(--surface);border:0;border-radius:14px;outline:none;
    box-shadow:var(--press);
  }
  input:focus{outline:2px solid var(--accent);outline-offset:2px}
  input::placeholder{color:var(--ink-3)}
  .hint{font-size:12.5px;color:var(--ink-2);margin-top:7px}
  button{
    width:100%;margin-top:24px;padding:14px;font:inherit;font-size:16px;font-weight:600;
    color:var(--accent-ink);background:var(--accent);border:0;border-radius:14px;
    box-shadow:var(--raise-sm);
  }
  button:active{box-shadow:var(--press-sm);transform:translateY(1px)}
  .foot{text-align:center;color:var(--ink-2);font-size:12.5px;margin-top:22px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="plate"><span class="dot"></span><span class="logo">emtext</span></div>
    <div class="sub">pendant Wi-Fi setup</div>
  </header>

  <form method="POST" action="/save">
    <div class="card">
      <label>Wi-Fi network</label>
      <input name="ssid" value="%SSID%" placeholder="network name"
             autocapitalize="off" autocorrect="off" spellcheck="false">

      <label>Wi-Fi password</label>
      <input name="pass" type="password" placeholder="leave blank to keep current">

      <label>Server host</label>
      <input name="host" value="%HOST%" placeholder="emtext.example.com"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="hint">hostname only — no https:// and no /stream</div>

      <label>Access token</label>
      <input name="token" type="password" placeholder="leave blank to keep current">

      <button type="submit">Save and reconnect</button>
    </div>
  </form>

  <div class="foot">The pendant saves this and reconnects. You can then rejoin your own Wi-Fi.</div>
</div>
</body>
</html>
